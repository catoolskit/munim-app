name: Build MUNIM

on:
  push:
    branches: [ main, pro-dev ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller "selenium>=4.20"

      - name: Build MUNIM Books
        run: |
          pyinstaller --onefile --windowed --name MUNIM `
            --icon assets/munim.ico `
            --collect-all customtkinter `
            --add-data "ui;ui" `
            --add-data "utils;utils" `
            --add-data "db;db" `
            --add-data "assets;assets" `
            main.py

      - name: Build MUNIM Pro
        if: hashFiles('pro_main.py') != ''
        run: |
          pyinstaller --onefile --windowed --name MUNIMPro `
            --icon assets/munim.ico `
            --collect-all customtkinter `
            --collect-all selenium `
            --add-data "ui;ui" `
            --add-data "utils;utils" `
            --add-data "db;db" `
            --add-data "assets;assets" `
            pro_main.py

      - name: Upload MUNIM Books artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUNIM-exe
          path: dist/MUNIM.exe

      - name: Upload MUNIM Pro artifact
        if: hashFiles('pro_main.py') != ''
        uses: actions/upload-artifact@v4
        with:
          name: MUNIMPro-exe
          path: dist/MUNIMPro.exe

      # Only MUNIM Books goes to the public release for now.
      # MUNIMPro.exe will be added here when Pro is launched.
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MUNIM.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
