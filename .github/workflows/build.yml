name: Build MUNIM.exe
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --onefile --windowed --name MUNIM --icon assets/munim.ico --collect-all customtkinter main.py
      - uses: actions/upload-artifact@v4
        with:
          name: MUNIM
          path: dist/MUNIM.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/MUNIM.exe
